name: Deploy to Netlify

on:
  push:
    branches: [main]
    paths:
      - 'site-data.json'
      - 'index.html'
      - 'assets/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
